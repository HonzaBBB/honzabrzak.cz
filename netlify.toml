# Netlify — honzabrzak.cz
# Statický web, žádný build step. Formuláře přes Netlify Forms.

[build]
  publish = "."
  # Sjednotí header/footer ze partials/ před deployem
  command = "node scripts/inject-nav.js"

# Deploy preview nesmí indexovat Google
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Branch deploys taky noindex
[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Základní bezpečnostní hlavičky (produkce i preview)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pretty URLs: /cenik → /cenik/ (Netlify to dělá defaultně u složek s index.html)

# 301 — stará Tilda URL (podtržítko) → nová se spojovníkem
[[redirects]]
  from = "/obchodni_podminky"
  to = "/obchodni-podminky/"
  status = 301

[[redirects]]
  from = "/obchodni_podminky/"
  to = "/obchodni-podminky/"
  status = 301

# Stará Tilda URL → Jak pracuji
# force: ve složce jak_funguje_spoluprace_se_mnou/ zůstal index.html,
# bez force by ho Netlify servíroval místo přesměrování
[[redirects]]
  from = "/jak_funguje_spoluprace_se_mnou"
  to = "/jak-pracuji/"
  status = 301
  force = true

[[redirects]]
  from = "/jak_funguje_spoluprace_se_mnou/"
  to = "/jak-pracuji/"
  status = 301
  force = true

# Další staré Tilda URL (podle Search Console, 10/2026)
[[redirects]]
  from = "/o_mne"
  to = "/o-mne/"
  status = 301

[[redirects]]
  from = "/o_mne/"
  to = "/o-mne/"
  status = 301

# FAQ zatím nemá vlastní stránku, otázky jsou na ceníku
[[redirects]]
  from = "/faq"
  to = "/cenik/"
  status = 301

[[redirects]]
  from = "/faq/"
  to = "/cenik/"
  status = 301

[[redirects]]
  from = "/certifikaty"
  to = "/o-mne/"
  status = 301

[[redirects]]
  from = "/certifikaty/"
  to = "/o-mne/"
  status = 301

# Anglická verze na novém webu není
[[redirects]]
  from = "/en"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/"
  status = 301

# Staré články blogu z Tildy (/blog/xxxx-…) → přehled blogu.
# Bez force: nový článek ve vlastní složce má přednost před tímhle pravidlem.
# Až se článek obnoví pod novou adresou, přidej nad tohle pravidlo
# přesměrování ze staré adresy na novou.
[[redirects]]
  from = "/blog/*"
  to = "/blog/"
  status = 301

# Interní složky — neindexovat / nezobrazovat veřejně (soubory v repu zůstávají)
[[redirects]]
  from = "/mockups/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/partials/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 404
  force = true
