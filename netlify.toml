# Netlify — honzabrzak.cz
# Statický web, žádný build step. Formuláře přes Netlify Forms.

[build]
  publish = "."
  # Žádný build command — čisté HTML/CSS

# Deploy preview nesmí indexovat Google
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Branch deploys taky noindex
[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Základní bezpečnostní hlavičky (produkce i preview)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pretty URLs: /cenik → /cenik/ (Netlify to dělá defaultně u složek s index.html)

# 301 — stará Tilda URL (podtržítko) → nová se spojovníkem
[[redirects]]
  from = "/obchodni_podminky"
  to = "/obchodni-podminky/"
  status = 301

[[redirects]]
  from = "/obchodni_podminky/"
  to = "/obchodni-podminky/"
  status = 301

# Stará Tilda URL → Jak pracuji
[[redirects]]
  from = "/jak_funguje_spoluprace_se_mnou"
  to = "/jak-pracuji/"
  status = 301

[[redirects]]
  from = "/jak_funguje_spoluprace_se_mnou/"
  to = "/jak-pracuji/"
  status = 301
