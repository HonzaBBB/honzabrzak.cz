<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero — varianta A v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --color-ink: #121214;
    --color-paper: #ffffff;
    --color-fog: #f4f4f2;
    --color-slate: #5a5f66;
    --color-line: #e3e3e0;
    --color-brand-50: #e9ecf3;
    --color-brand-100: #bdc5db;
    --color-brand-300: #7c8bb8;
    --color-brand-600: #243e88;
    --color-brand-800: #1d326d;
    --color-brand-900: #172858;
    --color-brand: var(--color-brand-600);
    --font-display: "Plus Jakarta Sans", sans-serif;
    --font-body: "Inter", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
    --space-1: 8px; --space-2: 16px; --space-3: 24px; --space-4: 32px; --space-6: 48px; --space-8: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); color: var(--color-ink); background: var(--color-paper); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-3); }
  h1 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  a { color: inherit; text-decoration: none; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-brand);
  }

  .hero-a {
    padding: var(--space-12, 96px) 0 var(--space-8);
    border-bottom: 1px solid var(--color-line);
  }
  .hero-a .grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: var(--space-6);
    align-items: center;
  }
  .hero-a h1 { font-size: 48px; margin: var(--space-2) 0 var(--space-3); }
  .hero-a p.lead { font-size: 18px; color: var(--color-slate); max-width: 480px; margin-bottom: var(--space-4); }
  .tag-row { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-4); }
  .tag { background: var(--color-fog); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.03em; text-transform: uppercase; padding: 6px 12px; color: var(--color-ink); }
  .btn-row { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .btn { display: inline-block; padding: 14px 28px; font-size: 15px; font-weight: 500; transition: background 120ms ease, color 120ms ease; }
  .btn-primary { background: var(--color-brand-600); color: var(--color-paper); }
  .btn-primary:hover { background: var(--color-brand-800); }
  .btn-secondary { background: var(--color-brand-50); color: var(--color-brand-800); }
  .btn-secondary:hover { background: var(--color-brand-300); color: var(--color-paper); }

  .photo-frame {
    position: relative;
    border: 1px solid var(--color-line);
    aspect-ratio: 1 / 1;
  }
  .photo-crop {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .photo-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-fog);
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-slate);
  }
  .badge-ring {
    position: absolute;
    bottom: -24px;
    left: -24px;
    width: 96px;
    height: 96px;
    border: 1.5px solid var(--color-brand);
    border-radius: 50%;
    background: var(--color-paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    color: var(--color-brand);
    text-align: center;
    line-height: 1.2;
  }
  .badge-ring strong { font-size: 12px; font-weight: 600; letter-spacing: 0.01em; }
  .badge-ring small { font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-slate); margin-top: 3px; }

  @media (max-width: 760px) {
    .hero-a .grid { grid-template-columns: 1fr; }
    .hero-a h1 { font-size: 36px; }
  }
</style>
</head>
<body>

<section class="hero-a">
  <div class="container grid">
    <div>
      <div class="eyebrow">PPC Freelancer</div>
      <h1>Standardizované řízení PPC</h1>
      <p class="lead">Používám vlastní procesy a automatizace pro přesnou a spolehlivou každodenní správu kampaní. Mám tak prostor věnovat se strategii a specifikům každého klienta.</p>
      <div class="tag-row">
        <span class="tag">Google Ads</span>
        <span class="tag">Sklik</span>
        <span class="tag">GA4</span>
      </div>
      <div class="btn-row">
        <a href="#" class="btn btn-primary">Napsat zprávu</a>
        <a href="#" class="btn btn-secondary">Jak pracuji</a>
      </div>
    </div>
    <div class="photo-frame">
      <div class="photo-crop">
        <div class="photo-placeholder">obrázek</div>
      </div>
      <div class="badge-ring"><strong>GOOGLE</strong><small>Partner</small></div>
    </div>
  </div>
</section>

</body>
</html>
